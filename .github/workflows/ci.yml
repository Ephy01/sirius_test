name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m alembic -c alembic.ini check
        working-directory: backend

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: "ci-database-password"
          ORGANIZER_CODE: "CI-ORGANIZER"
          SECURITY_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          CODE_HMAC_SECRET: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
      - run: docker build --file Dockerfile.frontend --tag sirius-gate-web:test .
      - run: docker build --file backend/Dockerfile --tag sirius-gate-api:test backend
